<div class="dashboard-shell flex min-h-screen w-full overflow-hidden">
  <nav class="sidebar-rail flex w-16 flex-col items-center border-r border-slate-300 bg-slate-50/50 py-6 backdrop-blur-md z-50 flex-shrink-0 sticky top-0 h-screen">
    <button
      type="button"
      class="history-toggle-btn group flex h-10 w-10 items-center justify-center rounded-xl border border-slate-400/50 bg-slate-200/80 transition-all hover:bg-sky-100 hover:border-sky-400"
      [class.active-rail-btn]="historySidebarOpen()"
      (click)="toggleHistorySidebar()"
      title="Historia zapytan"
    >
      <svg 
        viewBox="0 0 24 24" 
        class="h-5 w-5 text-slate-600 transition-colors group-hover:text-sky-600" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
      >
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
        <path d="M3 3v5h5"></path>
        <path d="M12 7v5l4 2"></path>
      </svg>
    </button>
  </nav>

  <div class="dashboard-layout flex-1" [class.sidebar-closed]="!historySidebarOpen()">
    <app-dashboard-history-sidebar
      class="chat-sidebar"
      [class.chat-sidebar-hidden]="!historySidebarOpen()"
      [loading]="historyLoading()"
      [errorMessage]="historyErrorMessage()"
      [entries]="queryHistory()"
      (refreshRequested)="refreshHistory()"
      (queryReuseRequested)="reuseHistoryQuery($event)"
    ></app-dashboard-history-sidebar>

    <main class="main-content-area overflow-y-auto px-4 py-6 sm:px-8 sm:py-8 lg:px-12 lg:py-10">
      <div class="max-w-[1400px] mx-auto space-y-6">
        <header class="dashboard-hero rounded-2xl border border-slate-400/55 bg-gradient-to-br from-stone-100/92 via-slate-100/86 to-sky-100/78 p-6 shadow-[0_20px_60px_-42px_rgba(15,23,42,0.4)] backdrop-blur-md">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.25em] text-slate-700">NL2SQL Expert Console</p>
              <h1 class="mt-2 text-2xl font-semibold text-slate-900 sm:text-3xl">Dashboard</h1>
            </div>
            <span class="rounded-full border border-slate-400 bg-slate-200/80 px-4 py-1 text-xs font-semibold uppercase tracking-[0.16em] text-slate-700">
              Live Analysis
            </span>
          </div>
          <p class="mt-4 max-w-3xl text-sm text-slate-700">
            Konsola wspiera analize zapytan w jezyku naturalnym, inspekcje SQL oraz transparentne wyjasnianie dzialania modelu.
          </p>
        </header>

        <div class="grid gap-6 xl:grid-cols-[minmax(0,2.2fr)_minmax(320px,1fr)]">
          <section class="panel xl:col-span-2">
            <app-dashboard-analysis-panel
              [queryDraft]="queryDraft()"
              [loading]="loading()"
              [canExecute]="canExecute()"
              (queryDraftChanged)="setQueryDraft($event)"
              (executionRequested)="executeAnalysis()"
            ></app-dashboard-analysis-panel>
          </section>

          <section class="panel min-w-0">
            <app-dashboard-results-panel
              [loading]="loading()"
              [rowCount]="rowCount()"
              [columns]="resultColumns()"
              [rows]="resultRows()"
            ></app-dashboard-results-panel>
          </section>

          <aside class="panel">
            <app-dashboard-technical-inspector
              [statusBadgeClass]="statusBadgeClass()"
              [statusLabel]="statusLabel()"
              [statusIconClass]="statusIconClass()"
              [statusNote]="statusNote()"
              [isSuccess]="isSuccess()"
              [isError]="isError()"
              [executionTimeLabel]="executionTimeLabel()"
              [showAutoCorrectionNotice]="showAutoCorrectionNotice()"
              [activeErrorLog]="activeErrorLog()"
              [generatedSql]="generatedSql()"
            ></app-dashboard-technical-inspector>
          </aside>

          <section class="panel xl:col-span-2">
            <app-dashboard-explainability-panel [explainability]="explainability()"></app-dashboard-explainability-panel>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>
