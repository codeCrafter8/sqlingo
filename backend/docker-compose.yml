services:
  pgvector-db:
    image: ankane/pgvector:latest
    container_name: nl2sql-vector-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: nl2sql_metadata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
