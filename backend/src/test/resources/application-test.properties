# Use the dedicated hospital database for tests
spring.datasource.url=jdbc:sqlite:src/main/resources/spider_dbs/hospital.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
# API key (taken from environment)
spring.ai.openai.api-key=${OPENAI_API_KEY}
# Reduce Hibernate logging so the report stays readable
logging.level.org.hibernate.SQL=ERROR
logging.level.com.codecrafter8.nl2sql=INFO
app.rag.mode=RAG
app.llm.self-correction-enabled=false
