spring.application.name=nl2sql-engine
# Server Configuration
server.port=8080
# Database Configuration - Spider Hospital SQLite Database
spring.datasource.url=jdbc:sqlite:./src/main/resources/spider_dbs/hospital.sqlite
spring.datasource.driverClassName=org.sqlite.JDBC
# JPA Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Disable schema initialization - using Spider database as-is
spring.sql.init.mode=never
# Logging
logging.level.com.codecrafter8.nl2sql=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework.ai=DEBUG
# LLM Configuration
llm.provider=openai
# Spring AI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${NL2SQL_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.0
spring.ai.openai.chat.options.max-tokens=2000
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.vectorstore.pgvector.enabled=false
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration
# PGVector (dedicated PostgreSQL connection for embeddings)
app.pgvector.datasource.url=jdbc:postgresql://localhost:5433/nl2sql_metadata
app.pgvector.datasource.username=postgres
app.pgvector.datasource.password=postgres
app.pgvector.datasource.driver-class-name=org.postgresql.Driver
app.pgvector.table-name=vector_store
app.pgvector.dimensions=1536
app.pgvector.initialize-schema=true
app.pgvector.remove-existing-table=false
# Application Configuration
app.database.schema-introspection.enabled=true
app.sql-generation.validate-query=true
app.sql-generation.max-rows-limit=999999
app.sql-generation.system-prompt=${NL2SQL_SYSTEM_PROMPT:prompts/openai/generate-sql-system-zero-shot.txt}
app.llm.self-correction-enabled=false
# RAG Configuration
app.rag.enabled=true
app.rag.top-k=10
app.rag.similarity-threshold=0.4
app.rag.fallback-to-full-schema=false
app.rag.index-on-startup=false
app.rag.mode=RAG
