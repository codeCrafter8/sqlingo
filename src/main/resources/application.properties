spring.application.name=nl2sql-engine
# Server Configuration
server.port=8080
# Database Configuration (H2 for development, switch to PostgreSQL for production)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Logging
logging.level.com.codecrafter8.nl2sql=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework.ai=DEBUG
# LLM Configuration
llm.provider=openai
# Spring AI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-3.5-turbo
spring.ai.openai.chat.options.temperature=0.0
spring.ai.openai.chat.options.max-tokens=2000
# Application Configuration
app.database.schema-introspection.enabled=true
app.sql-generation.validate-query=true
app.sql-generation.max-rows-limit=1000
