spring.application.name=nl2sql-engine
# Server Configuration
server.port=8080
# Database Configuration - Spider Hospital SQLite Database
spring.datasource.url=jdbc:sqlite:./src/main/resources/spider_dbs/hospital.sqlite
spring.datasource.driverClassName=org.sqlite.JDBC
# JPA Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Disable schema initialization - using Spider database as-is
spring.sql.init.mode=never
# Logging
logging.level.com.codecrafter8.nl2sql=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework.ai=DEBUG
# LLM Configuration
llm.provider=openai
# Spring AI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-3.5-turbo
spring.ai.openai.chat.options.temperature=0.0
spring.ai.openai.chat.options.max-tokens=2000
# Application Configuration
app.database.schema-introspection.enabled=true
app.sql-generation.validate-query=true
app.sql-generation.max-rows-limit=1000
